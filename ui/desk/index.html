<!doctype html>
<html lang="en" data-density="compact" data-cb="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<!-- the backend writes its per-start X-Desk token here when it serves the page; empty on disk -->
<meta name="desk-token" content="">
<link rel="icon" href="data:,">
<title>Desk</title>
<link rel="stylesheet" href="desk.css">
<link rel="stylesheet" href="manual.css">
<link rel="stylesheet" href="systematic.css">
<!-- Classic scripts sharing window.Desk, in this order. No modules, no build, no network
     dependencies: the page opens from file:// in demo mode. -->
<script defer src="js/contract.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/sim.js"></script>
<script defer src="js/transport.js"></script>
<script defer src="js/header.js"></script>
<script defer src="js/manual.js"></script>
<script defer src="js/systematic.js"></script>
<script defer src="js/main.js"></script>
</head>
<body data-tab="manual">

<header id="hdr">
  <div class="tabsw" role="tablist">
    <button id="tab-sys" type="button" role="tab" data-tab="systematic"><span>SYSTEMATIC</span> <b id="tab-sys-st" class="tst dim"></b></button>
    <button id="tab-man" type="button" role="tab" data-tab="manual"><span>MANUAL</span> <b id="tab-man-n" class="tst dim">0</b></button>
    <button id="tab-split" type="button" role="tab">SPLIT</button>
  </div>
  <div class="hc" id="hc-kal"><span class="hl">KAL</span><span class="hv" id="h-kal"></span><span class="hs" id="h-kal-free"></span></div>
  <div class="hc" id="hc-pm"><span class="hl">PM</span><span class="hv" id="h-pm"></span><span class="hs" id="h-pm-free"></span><span class="tag warn ro" id="h-pm-ro">RO</span></div>
  <div class="hc" id="hc-day"><span class="hl">DAY</span><span class="hv" id="h-day"></span><span class="hs" id="h-day-split"></span></div>
  <div class="hc" id="hc-risk"><span class="hl">RISK</span><span class="hv" id="h-risk"></span></div>
  <div class="hc" id="hc-stop"><span class="hl">LOSS</span><span class="hv" id="h-stop"></span></div>
  <div class="hc" id="hc-sys"><span class="hl">SYS</span><span class="hv" id="h-sys"></span></div>
  <div class="hgap"></div>
  <div class="hh" id="h-kx">KX -</div>
  <div class="hh" id="h-pmh">PM -</div>
  <div class="hh" id="h-gw">GW -</div>
  <div class="hh" id="h-srv">SRV -</div>
  <div class="hh" id="h-clk">CLK -</div>
  <div class="hc" id="hc-mode"><span class="tag dim" id="h-mode"></span></div>
  <div class="hclock" id="h-clock"></div>
  <button id="kill" type="button">KILL</button>
</header>

<main id="tabs">

  <!-- SYSTEMATIC: strip 36 / lanes 164 / lower (working 250 + fills | risk 330 + markouts | LOG from 2400 px) -->
  <div class="tabroot" id="tab-systematic" tabindex="-1">
    <section class="panel strip" id="s-ctl">
      <div class="pbody" id="s-ctl-body"></div>
    </section>
    <section class="panel" id="s-lanes">
      <div class="ptitle"><span class="pname">LANES</span><span class="ptools" id="s-lanes-tools"></span></div>
      <div class="pbody" id="s-lanes-body"></div>
    </section>
    <div class="s-lower">
      <div class="s-left">
        <section class="panel" id="s-work">
          <div class="ptitle"><span class="pname">WORKING</span><span class="ptools" id="s-work-tools"></span></div>
          <div class="pbody" id="s-work-body"></div>
        </section>
        <section class="panel" id="s-fills">
          <div class="ptitle"><span class="pname">FILLS</span><span class="ptools" id="s-fills-tools"></span></div>
          <div class="pbody" id="s-fills-body"></div>
        </section>
      </div>
      <div class="s-right">
        <section class="panel" id="s-risk">
          <div class="ptitle"><span class="pname">RISK BOOK</span><span class="ptools" id="s-risk-tools"></span></div>
          <div class="pbody" id="s-risk-body"></div>
          <div class="pfoot" id="s-risk-foot"></div>
        </section>
        <section class="panel" id="s-mo">
          <div class="ptitle"><span class="pname">MARKOUTS</span><span class="ptools" id="s-mo-tools"></span></div>
          <div class="pbody" id="s-mo-body"></div>
        </section>
      </div>
      <section class="panel" id="s-log">
        <div class="ptitle"><span class="pname">LOG</span></div>
        <div class="pbody" id="s-log-body"></div>
      </section>
    </div>
  </div>

  <!-- MANUAL: watchlist 288 | ladder A 340 | ladder B 340 | (ladder C 340 from 1920 px, D from 2400) | right column -->
  <div class="tabroot" id="tab-manual" tabindex="-1">
    <section class="panel" id="m-watch" data-kscope="watch">
      <div class="ptitle"><span class="pname">MARKETS</span><span class="ptools" id="m-watch-tools"></span></div>
      <div class="pbody" id="m-watch-body"></div>
    </section>
    <section class="panel lad" id="m-lad-a" data-ladder="A" data-kscope="ladder" tabindex="0">
      <div class="lad-head" id="m-lad-a-head"></div>
      <div class="lad-cols" id="m-lad-a-cols"></div>
      <div class="pbody lad-rows" id="m-lad-a-body"></div>
      <div class="lad-foot" id="m-lad-a-foot"></div>
    </section>
    <section class="panel lad" id="m-lad-b" data-ladder="B" data-kscope="ladder" tabindex="0">
      <div class="lad-head" id="m-lad-b-head"></div>
      <div class="lad-cols" id="m-lad-b-cols"></div>
      <div class="pbody lad-rows" id="m-lad-b-body"></div>
      <div class="lad-foot" id="m-lad-b-foot"></div>
    </section>
    <section class="panel lad" id="m-lad-c" data-ladder="C" data-kscope="ladder" tabindex="0">
      <div class="lad-head" id="m-lad-c-head"></div>
      <div class="lad-cols" id="m-lad-c-cols"></div>
      <div class="pbody lad-rows" id="m-lad-c-body"></div>
      <div class="lad-foot" id="m-lad-c-foot"></div>
    </section>
    <section class="panel lad" id="m-lad-d" data-ladder="D" data-kscope="ladder" tabindex="0">
      <div class="lad-head" id="m-lad-d-head"></div>
      <div class="lad-cols" id="m-lad-d-cols"></div>
      <div class="pbody lad-rows" id="m-lad-d-body"></div>
      <div class="lad-foot" id="m-lad-d-foot"></div>
    </section>
    <div class="m-right">
      <section class="panel" id="m-ticket" data-kscope="ticket">
        <div class="ptitle"><span class="pname">TICKET</span><span class="ptools" id="m-ticket-tools"></span></div>
        <div class="pbody" id="m-ticket-body"></div>
      </section>
      <section class="panel" id="m-work">
        <div class="ptitle"><span class="pname">WORKING</span><span class="ptools" id="m-work-tools"></span></div>
        <div class="pbody" id="m-work-body"></div>
      </section>
      <section class="panel" id="m-fills">
        <div class="ptitle"><span class="pname">FILLS</span><span class="ptools" id="m-fills-tools"></span></div>
        <div class="pbody" id="m-fills-body"></div>
      </section>
      <section class="panel" id="m-pos">
        <div class="ptitle"><span class="pname">POSITIONS</span><span class="ptools" id="m-pos-tools"></span></div>
        <div class="pbody" id="m-pos-body"></div>
      </section>
    </div>
  </div>

</main>

<footer id="sbar">
  <button id="sb-alert" class="sb-alert" type="button"></button>
  <span class="sbc off" id="sb-stale"></span>
  <span class="sbc off" id="sb-err"></span>
  <span class="sbc dim" id="sb-hk">HOTKEYS OFF</span>
  <span class="sbc" id="sb-ui">UI -</span>
  <span class="sbc" id="sb-ack">ACK -</span>
  <button class="sbc" id="sb-set" type="button">SET</button>
  <button class="sbc" id="sb-keys" type="button">? keys</button>
</footer>

<div id="logdrawer" class="panel">
  <div class="ptitle"><span class="pname">LOG</span><span class="ptools"><button id="log-close" type="button">x</button></span></div>
  <div class="pbody" id="log-body"></div>
</div>

<div id="setdrawer" class="panel">
  <div class="ptitle"><span class="pname">SETTINGS</span><span class="ptools"><button id="set-close" type="button">x</button></span></div>
  <div class="pbody set-body">
    <div class="set-col" id="set-lanes"></div>
    <div class="set-col" id="set-fees"></div>
    <div class="set-col" id="set-limits"></div>
  </div>
</div>

<div id="keysheet">
  <div class="sheet panel">
    <div class="ptitle"><span class="pname">KEYS</span><span class="ptools"><button id="keysheet-close" type="button">x</button></span></div>
    <div class="pbody" id="keysheet-body"></div>
  </div>
</div>

</body>
</html>
